
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Day 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>QuickNotes</h1>
        <p class="tagline">Capture ideas before they disappear.</p>

        <label for="note-text">Write your note:</label>
        <textarea
            id="note-text"
            placeholder="Start typing your note here..."
            rows="8"
            maxlength="10000"
        ></textarea>

        <div class="counters">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
        </div>

        <div class="buttons">
            <button id="clear-btn" type="button">Clear</button>
            <button id="theme-toggle" type="button">Dark mode</button>
        </div>

        <p class="hint">Tip: Press Escape inside the text area to clear your note.</p>
    </main>
</body>
</html>
